<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ScheduleFlex | Login</title>
        <link rel="stylesheet" href="/styles/main.css" />
        <link rel="stylesheet" href="/styles/login.css" />
    </head>

    <body>
        <header class="main-header">
            <!-- Logo -->
            <div class="logo">Schedule<span>Flex</span></div>
            <!-- Navigation Bar (Removed for login page) -->
        </header>
        <main>
            <div class="container">
                <h1>Login or Create an Account</h1>
                <section class="auth-container">
                    <span
                        ><button
                            type="button"
                            data-show-form="accept-invite-form"
                        >
                            Accept an invite
                        </button>
                        <button type="button" data-show-form="login-form">
                            Log in
                        </button></span
                    >
                    <span id="admin-btn-container"
                        >Or:<br /><button
                            type="button"
                            id="btn-admin"
                            data-show-form="create-admin-account-form"
                        >
                            Create Administrative Account
                        </button></span
                    >
                </section>

                <!-- ###################### INVITATIONS FORM ###################### -->
                <form id="accept-invite-form" style="display: none">
                    <div>
                        <div>
                            <label for="invite-code"
                                >Paste your invitation code:</label
                            >
                            <input required type="text" id="invite-code" />
                            <input type="submit" value="accept invite" />
                        </div>
                    </div>
                </form>
                <form id="create-password-form" style="display: none">
                    <div>
                        <p id="invitee-email" style="color: #ccc"></p>
                        <p>Enter a new password:</p>
                        <p>
                            Minimum 6 characters<br />At least one letter<br />At
                            least one number
                        </p>
                        <span>
                            <input required type="password" id="new-password" />
                            <input type="submit" value="submit" />
                        </span>
                    </div>
                </form>

                <!-- ###################### STANDARD LOGIN FORM ###################### -->
                <form id="login-form" style="display: none">
                    <div>
                        <label for="email">Email</label>
                        <input required type="text" id="email" />
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input required type="password" id="password" />
                    </div>
                    <div>
                        <input type="submit" value="submit" />
                    </div>
                </form>

                <!-- ###################### CREATE ACCOUNT FORM ###################### -->
                <form id="create-admin-account-form" style="display: none">
                    <div>
                        <label for="admin-email">Email</label>
                        <input required type="text" id="admin-email" />
                    </div>
                    <div>
                        <label for="admin-password">Create a Password</label>
                        <input required type="password" id="admin-password" />
                    </div>
                    <div>
                        <label for="admin-secret">Admin Passphrase</label>
                        <input required type="password" id="admin-secret" />
                    </div>
                    <div>
                        <input type="submit" value="submit" />
                    </div>
                </form>

                <section id="auth-msg"></section>
            </div>
        </main>
        <footer></footer>
        <script src="/scripts/navbar.js"></script>
        <script src="/scripts/login.js"></script>
    </body>
</html>
