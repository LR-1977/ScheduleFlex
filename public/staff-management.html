<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScheduleFlex | Staff Management</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <style>
        /* Quick styles for the employee table */
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #ccc; }
        .admin-badge { background: #007bff; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="logo">Schedule<span>Flex</span></div>
        <nav>
            <ul id="nav-links" class="nav-list"></ul>
        </nav>
    </header>

    <main class="dashboard">
        <section class="management-container">
            <h2>Staff Management</h2>
            
            <div id="status-msg" style="padding: 10px; margin-bottom: 10px; display: none; border-radius: 5px;"></div>

            <div class="invite-section" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <h3>Invite New Employee</h3>
                <form id="invite-form">
                    <label for="invite-email">Employee Email Address:</label>
                    <input type="email" id="invite-email" required placeholder="new.hire@example.com" style="padding: 5px; width: 250px;">
                    <button type="submit" style="padding: 6px 12px;">Send Invite</button>
                </form>
            </div>

            <div class="employee-list-section">
                <h3>Current Staff</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body">
                        <tr><td colspan="3">Loading employees...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/scripts/navbar.js"></script>
    <script src="/scripts/staff-management.js"></script>
</body>
</html>
