<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, inital-scale=1.0" />
        <title>ScheduleFlex | Calendar</title>
        <link rel="stylesheet" href="/styles/main.css" />
        <script>
            let cookie = document.cookie;
            let mode = cookie.slice(6);
            if (mode == "dark") {
                document.documentElement.setAttribute('data-theme', "dark");
            }
        </script>
    </head>
    <body>
        <header id = "main-header" class="main-header">
            <!-- Logo -->
            <div class="logo">Schedule<span>Flex</span></div>
            <!-- Navigation Bar -->
            <nav>
                <ul id="nav-links" class="nav-list"></ul>
            </nav>
        </header>

        <!-- TEMP: Role Switch for different Nav Links -->
        <div id = "temp-controls" class="header-controls">
            <!--
            <button class="role-switcher" onclick="switchRoleTest()">
                Switch Role
            </button>
            -->
        </div>

        <div id="sidebar" class="sideBar" >
            <div id="sidebar-tab" class="sidebar-tab" onclick="toggleSidebar()" title="Toggle Sidebar">
                <span class="sidebar-tab-arrow">&#9664;</span>
            </div>
            <div class="sidebar-content">
                <div id ="side-title">Miraculous Manager's Manpower Manifest</div>
                <nav>
                    <ul id="side-links" class="side-list"></ul>
                    <ul id="side-buttons" class="side-buttons"></ul>

                    <ul id="assignment-form" class="side-list"></ul>
                    <ul id="assignment-buttons" class="side-buttons"></ul>

                    <ul id="reschedule-request" class="side-list"></ul>
                    <ul id="reschedule-buttons" class="side-buttons"></ul>
                </nav>
            </div>
        </div>
        <!-- Calendar -->
        <main id="dashboard" class="dashboard">
            <section class="calendar-container">
                <div class="calendar-header">
                    <h2 id="month-display">Month Year</h2>
                    <p id="calendar-scope"></p>
                    <div class="nav-btns">
                        <button class="btn-icon" onclick="changeMonth(-1)">
                            Prev Month
                        </button>
                        <button class="btn-icon" onclick="changeMonth(1)">
                            Next Month
                        </button>
                    </div>
                </div>

                <div class="calendar-grid" id="calendar-grid"></div>
            </section>
        </main>

        <!-- Scripts -->
        <script src="/scripts/navbar.js"></script>
        <script src="/scripts/calendar.js"></script>
        <script src="/scripts/sidebar.js"></script>
    </body>
</html>
