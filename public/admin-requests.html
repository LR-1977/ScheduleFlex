<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, inital-scale=1.0" />
        <title>ScheduleFlex | Employee Requests</title>
        <link rel="stylesheet" href="/styles/main.css" />
        <link rel="stylesheet" href="/styles/admin-requests.css"/>
        <script>
            let cookie = document.cookie;
            let mode = cookie.slice(6);
            if (mode == "dark") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        </script>
    </head>
    <body>
        <header class="main-header">
            <!-- Logo -->
            <div class="logo">Schedule<span>Flex</span></div>
            <!-- Navigation Bar -->
            <nav>
                <ul id="nav-links" class="nav-list"></ul>
            </nav>
        </header>

        <main class = "requests-page">
            <div class = "page-header">
                <div>
                    <h1>Shift Requests</h1>
                    <p class = "page-subtitle">Review and action pending requests from drivers.</p>
                </div>
                <div class = "summary-bar">
                    <div class = "summary-chip" id = "chip-total">
                        <span class = "chip-count" id = "count-total">-</span>
                        <span class = "chip-label">Pending</span>
                    </div>
                    <div class = "summary-chip" id = "chip-swap">
                        <span class="chip-count" id = "count-swap">-</span>
                        <span class = "chip-label">Swaps</span>
                    </div>
                    <div class = "summary-chip" id="chip-off">
                        <span class = "chip-count" id = "count-off">-</span>
                        <span class = "chip-label">Time Off</span>
                    </div>
                </div>
            </div>

            <div class="filter-tabs" id = "filter-tabs">
                <button class="tab active" data-filter = "all">All</button>
                <button class="tab" data-filter = "shift_swap">Swap Shifts</button> 
                <button class="tab" data-filter = "time_off">Time Off</button>
            </div>

            <div id="requests-container" class = "requests-container">
                <div class="loading-state" id="loading-state">
                    <span>Loading Requests...</span>
                </div>
            </div>
        </main>

        <div class="modal-overlay" id ="modal-overlay">
            <div class= "modal">
                <p class = "modal-message" id = "modal-message"></p>
                <div class = "modal-actions">
                    <button class = "btn-confirm" id = "modal-confirm">Confirm</button>
                    <button class= "btn-modal-cancel" id = "modal-cancel">Cancel</button>
                </div>
            </div>
        </div>
        <script src="/scripts/navbar.js"></script>
        <script src = "/scripts/admin-requests.js"></script>
    </body>
</html>
